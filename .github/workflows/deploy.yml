# ─────────────────────────────────────────────────────────
# CAFT Financial Frontend — CI/CD Pipeline
# Triggers on push/merge to main branch
# ─────────────────────────────────────────────────────────

name: Deploy Frontend

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 358464500004.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: caft-frontend
  EC2_USER: ubuntu

jobs:
  deploy:
    name: Build & Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
            --build-arg NEXT_PUBLIC_RAZORPAY_KEY_ID=${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # Login to ECR
            aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 358464500004.dkr.ecr.ap-south-1.amazonaws.com

            # Pull latest image
            docker pull 358464500004.dkr.ecr.ap-south-1.amazonaws.com/caft-frontend:latest

            # Restart frontend
            cd /opt/caft
            docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate frontend

            # Cleanup old images
            docker image prune -af --filter "until=24h" || true

            echo "✅ Frontend deployed successfully"
